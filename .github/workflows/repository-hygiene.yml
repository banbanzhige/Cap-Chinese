name: Repository hygiene

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check source-only repository and release naming
        run: node scripts/check-repo-hygiene.cjs
      - name: Check licenses, documentation and ignored private files
        run: node scripts/check-open-source.cjs
